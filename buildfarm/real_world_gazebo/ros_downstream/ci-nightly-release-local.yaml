%YAML 1.1
# Downstream ROS 2 Distribution CI Job (binary_import extending gz_harmonic)
---
build_tool: colcon
build_tool_args: '--cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON --no-warn-unused-cli'
build_environment_variables:
  ROS_BUILDFARM_BINARY_IMPORT_DISTROS: gz_harmonic
jenkins_job_label: ci-agent
jenkins_job_priority: 200
jenkins_job_timeout: 60
package_dependencies: true
package_names:
- ros_gz_math_demo
urls:
- http://repos.ros.org/repos/ros_bootstrap
- http://192.168.30.202:8088/ubuntu/building
- http://192.168.30.202:8088/ubuntu/testing
targets:
  ubuntu:
    noble:
      amd64:
type: ci-build
version: 1
